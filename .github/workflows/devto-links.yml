name: Update Dev.to article links

on:
  schedule:
    - cron: "15 15 * * *"   # 8:45 PM IST daily, after articles go live
  workflow_dispatch:

permissions:
  contents: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/devto_links.py
      - name: Save links
        run: |
          git config user.name "Ujjwal Sinha"
          git config user.email "355295818+usinha79@users.noreply.github.com"
          git add .github/devto-links.json
          git diff --cached --quiet || (git commit -m "Update Dev.to article links [skip ci]" && git push)
