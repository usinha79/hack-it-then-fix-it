name: Update Dev.to article links

on:
  schedule:
    - cron: "15 15 * * *"   # 8:45 PM IST daily, after articles go live
    # GitHub delays scheduled runs (often 30-90 min, worst near :00/:15),
    # so extra off-minute runs keep the list current. The job is idempotent.
    - cron: "23 15 * * *"   # 8:53 PM IST
    - cron: "47 15 * * *"   # 9:17 PM IST
    - cron: "13 16 * * *"   # 9:43 PM IST
    - cron: "29 16 * * *"   # 9:59 PM IST
    - cron: "10 18 * * *"   # 11:40 PM IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: devto-links
  cancel-in-progress: false

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/devto_links.py
      - name: Save links
        run: |
          git config user.name "Ujjwal Sinha"
          git config user.email "355295818+usinha79@users.noreply.github.com"
          git add .github/devto-links.json
          git diff --cached --quiet || (git commit -m "Update Dev.to article links [skip ci]" && (git push || (git pull --rebase && git push)))
