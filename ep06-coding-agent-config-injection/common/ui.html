<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f4f5f8; --card:#fff; --ink:#151a24; --mute:#6b7280; --line:#e5e7eb; --brand:#4f46e5; --red:#dc2626; --green:#16a34a; --amber:#d97706; }
  * { box-sizing:border-box; }
  body { margin:0; font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; gap:16px; padding:14px 28px; background:var(--card); border-bottom:1px solid var(--line); }
  .logo { font-weight:800; font-size:22px; letter-spacing:-.02em; } .logo span { color:var(--brand); }
  .badge { font-size:12px; font-weight:700; letter-spacing:.08em; padding:5px 10px; border-radius:999px; color:#fff; background:#888; }
  .badge.vulnerable { background:var(--red); } .badge.fixed { background:var(--green); }
  .who { font-size:13px; font-weight:600; padding:5px 10px; border-radius:8px; background:#eef2ff; color:#3730a3; }
  .model { margin-left:auto; font-size:13px; color:var(--mute); }
  main { display:grid; grid-template-columns: 1.35fr 1fr; gap:22px; padding:22px 28px; height:calc(100vh - 62px); }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:16px; display:flex; flex-direction:column; min-height:0; }
  .panel h2 { font-size:15px; margin:0; padding:16px 20px; border-bottom:1px solid var(--line); }
  #log { flex:1; overflow-y:auto; padding:18px 20px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:86%; padding:11px 15px; border-radius:14px; font-size:15px; line-height:1.45; white-space:pre-wrap; }
  .user { align-self:flex-end; background:var(--brand); color:#fff; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#f1f2f6; border-bottom-left-radius:4px; }
  .bot.leak { background:#fef2f2; border:1px solid #fecaca; }
  form { display:flex; gap:10px; padding:14px; border-top:1px solid var(--line); }
  #msg { flex:1; font:inherit; font-size:15px; padding:12px 14px; border:1px solid var(--line); border-radius:10px; }
  button { font:inherit; font-weight:600; padding:0 20px; border:0; border-radius:10px; background:var(--brand); color:#fff; cursor:pointer; }
  .side { display:flex; flex-direction:column; gap:22px; min-height:0; }
  .side .panel { flex:1; }
  .side .panel.fit { flex:0 0 auto; }
  table { width:100%; border-collapse:collapse; font-size:15px; }
  td { padding:9px 20px; } td:last-child { text-align:right; font-variant-numeric:tabular-nums; }
  tr.red td { color:var(--red); font-weight:600; } tr.green td { color:var(--green); font-weight:600; }
  tr.total td { font-size:20px; font-weight:800; border-top:1px solid var(--line); }
  .items { padding:12px 16px; display:flex; flex-direction:column; gap:8px; overflow-y:auto; }
  .item { padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:#fafafa; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size:13px; white-space:pre-wrap; word-break:break-word; }
  .item.executed, .item.leak { border-color:#fecaca; background:#fff7f7; } .item.blocked, .item.ok { border-color:#bbf7d0; background:#f6fff8; }
  .item.warn { border-color:#fde68a; background:#fffbeb; }
  .item b { font-weight:700; } .tag { float:right; font-weight:700; margin-left:10px; }
  .executed .tag, .leak .tag { color:var(--red); } .blocked .tag, .ok .tag { color:var(--green); } .warn .tag { color:var(--amber); } .ran .tag { color:var(--mute); }
  .empty { color:var(--mute); font-size:14px; }
</style>
</head>
<body>
<header>
  <div class="logo" id="brand"></div>
  <div id="badge" class="badge">LAB</div>
  <div id="who" class="who" hidden></div>
  <div class="model" id="model"></div>
</header>
<main>
  <section class="panel">
    <h2 id="chattitle">Chat</h2>
    <div id="log"></div>
    <form id="f"><input id="msg" autocomplete="off" placeholder="Type a message…"><button>Send</button></form>
  </section>
  <div class="side" id="side"></div>
</main>
<script>
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function panels(ps){
  $("#side").innerHTML = ps.map(p => {
    let body;
    if (p.kind === "table") body = `<table>${p.rows.map(r => `<tr class="${r[2]||""}"><td>${esc(r[0])}</td><td>${esc(r[1])}</td></tr>`).join("")}</table>`;
    else body = `<div class="items">${p.items.length ? p.items.map(i => `<div class="item ${i.status||""}">${i.status ? `<span class="tag">${esc(i.status.toUpperCase())}</span>` : ""}${i.head ? `<b>${esc(i.head)}</b>\n` : ""}${esc(i.body||"")}</div>`).join("") : `<div class="empty">${esc(p.empty||"Nothing yet.")}</div>`}</div>`;
    return `<section class="panel ${p.fit ? "fit" : ""}" id="p-${p.id}"><h2>${esc(p.title)}</h2>${body}</section>`;
  }).join("");
}
let RENDER_HTML = false;
function add(cls, text){ const d = document.createElement("div"); d.className = "msg " + cls;
  if (RENDER_HTML && cls.startsWith("bot")) d.innerHTML = text; else d.textContent = text;
  $("#log").appendChild(d); $("#log").scrollTop = 1e9; return d; }
setInterval(() => fetch("/api/info").then(r => r.json()).then(j => panels(j.panels)).catch(() => {}), 1000);
fetch("/api/info").then(r => r.json()).then(j => {
  document.title = j.brand + " · " + j.bot;
  $("#brand").innerHTML = esc(j.brand).replace(/^(\w+?)([A-Z]\w*)/, "$1<span>$2</span>") ;
  $("#badge").textContent = "LAB · " + j.version.toUpperCase(); $("#badge").classList.add(j.version);
  if (j.who) { $("#who").hidden = false; $("#who").textContent = "Signed in: " + j.who; }
  RENDER_HTML = !!j.render_html;
  $("#model").textContent = "Model: " + j.model; $("#chattitle").textContent = "Chat with " + j.bot;
  add("bot", j.greeting); panels(j.panels);
});
$("#f").onsubmit = async e => {
  e.preventDefault(); const t = $("#msg").value.trim(); if (!t) return;
  $("#msg").value = ""; add("user", t);
  const j = await (await fetch("/api/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({message:t})})).json();
  add("bot" + (j.leak ? " leak" : ""), j.reply); panels(j.panels);
  document.body.dataset.done = Date.now();
};
</script>
</body>
</html>
